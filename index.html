<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>농지 주소·면적 측정기</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=25bd6279b09da3619d1cfc1619d628f2&libraries=services&autoload=false"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #111827;
      color: #111827;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    #map {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 상단 패널 */
    .top-panel {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      padding: 10px 12px;
    }
    .search-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 0 10px;
      font-size: 14px;
      background: #fff;
      color: #111827;
      user-select: text;
    }
    .btn-sm {
      height: 36px;
      padding: 0 10px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #1f2937;
      color: #fff;
      white-space: nowrap;
    }
    .btn-sm.secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-sm.active-mode {
      background: #d97706;
      color: #fff;
    }

    .search-results {
      margin-top: 6px;
      max-height: 170px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      display: none;
    }
    .search-results.open {
      display: block;
    }
    .search-item {
      padding: 8px 10px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      cursor: pointer;
    }
    .search-item:last-child {
      border-bottom: none;
    }
    .search-item:active {
      background: #fef3c7;
    }
    .search-item-sub {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .info-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .parcel-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .parcel-sub {
      font-size: 11px;
      color: #4b5563;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .area-box {
      text-align: right;
      flex-shrink: 0;
    }
    .area-main {
      font-size: 16px;
      font-weight: 800;
      color: #b91c1c;
    }
    .area-detail {
      font-size: 11px;
      color: #4b5563;
    }

    .mode-banner {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .mode-banner.exclude {
      background: #fef3c7;
      color: #92400e;
    }

    /* 제외 영역 관리 바 */
    .exclude-bar {
      margin-top: 6px;
      display: none;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .exclude-bar.show {
      display: flex;
    }
    .exclude-select {
      flex: 1;
      min-width: 120px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid #d1d5db;
      padding: 0 6px;
      font-size: 12px;
      background: #fff;
    }

    /* 우측 지도 컨트롤 */
    .right-controls {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 18;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .map-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.95);
      color: #111827;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* 중앙 십자선 */
    .center-crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }
    .center-crosshair::before,
    .center-crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.85);
    }
    .center-crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    .center-crosshair::after {
      top: 50%;
      left: 0;
      height: 2px;
      width: 100%;
      transform: translateY(-50%);
    }

    /* 중앙 점 찍기 버튼 */
    .add-point-btn {
      position: fixed;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 800;
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    /* 하단 4버튼 바 */
    .bottom-bar {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .bottom-btn {
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .btn-gps { background: #15803d; color: #fff; }
    .btn-undo { background: #374151; color: #fff; font-size: 20
