<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b57d0" />
  <title>농지 주소·면적 측정기</title>
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=25bd6279b09da3619d1cfc1619d628f2&libraries=services"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      background: #111;
    }

    #mapViewport {
      position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    }
    #mapStage {
      position: relative; width: 100%; height: 100%;
      transform-origin: center center;
      transition: transform 0.14s ease-out;
    }
    #map { width: 100%; height: 100%; }

    .top-panel {
      position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 10;
      background: rgba(255, 255, 255, 0.95); border-radius: 10px;
      padding: 7px 9px; box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }
    .addr-row {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      background: #f3f5f8; padding: 5px 8px; border-radius: 7px; margin-bottom: 6px;
    }
    .addr-text {
      font-size: 12px; font-weight: 700; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .addr-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .mini-btn {
      padding: 4px 7px; font-size: 11px; font-weight: 700; border: 1px solid #bbb;
      background: #fff; border-radius: 5px; color: #222;
    }

    .search-bar { display: none; gap: 5px; margin-bottom: 6px; }
    .search-bar.open { display: flex; }
    .search-bar input {
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    .search-bar button {
      padding: 6px 10px; border: none; border-radius: 6px; background: #222; color: #fff; font-weight: 700; font-size: 12px;
    }

    .area-strip {
      display: grid; grid-template-columns: 1fr 1fr auto; gap: 5px; align-items: center;
    }
    .area-cell {
      background: #fafafa; border: 1px solid #e5e7eb; border-radius: 7px; padding: 5px 7px; min-width: 0;
    }
    .area-cell.active-total { border-color: #ff1744; background: #fff5f7; }
    .area-cell.active-sub { border-color: #d97706; background: #fffbeb; }
    .area-label { font-size: 10px; color: #555; font-weight: 700; display: flex; justify-content: space-between; }
    .area-main-red { font-size: 13px; font-weight: 800; color: #d50000; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .area-main-amber { font-size: 13px; font-weight: 800; color: #b45309; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .area-sub { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ratio-box { text-align: right; padding: 4px 5px; min-width: 58px; }
    .ratio-val { font-size: 13px; font-weight: 800; color: #d50000; line-height: 1.2; }
    .ratio-rem { font-size: 10px; color: #555; white-space: nowrap; }

    .right-panel {
      position: absolute; top: calc(144px + env(safe-area-inset-top)); right: 8px; z-index: 12;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    .layer-controls {
      display: flex; flex-direction: column; gap: 5px;
    }
    .layer-btn {
      padding: 7px 9px; border: none; border-radius: 7px;
      background: rgba(255,255,255,0.96); color: #222; font-size: 11px; font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.22);
    }
    .layer-btn.active { background: #0b57d0; color: #fff; }

    .zoom-controls {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      margin-top: 2px;
    }
    .zoom-btn {
      width: 40px; height: 40px; border: 1.5px solid #334155; border-radius: 9px;
      background: #ffffff; color: #111111;
      font-size: 22px; font-weight: 800; line-height: 1;
      box-shadow: 0 3px 8px rgba(0,0,0,0.28);
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-btn:active { background: #e2e8f0; }
    .zoom-badge {
      font-size: 10px; font-weight: 700; color: #fff;
      background: rgba(0,0,0,0.72); border-radius: 5px;
      padding: 2px 6px; text-align: center;
    }
    .mag-btn {
      width: 40px; padding: 5px 0; border: 1.5px solid #334155; border-radius: 8px;
      background: rgba(255,255,255,0.96); color: #111;
      font-size: 11px; font-weight: 800; text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.22);
    }
    .mag-btn.active {
      background: #d50000; color: #fff; border-color: #d50000;
    }

    .bottom-bar {
      position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); left: 8px; right: 8px; z-index: 10;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
    }
    .action-btn {
      padding: 11px 4px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 700; color: #fff;
      box-shadow: 0 2px 7px rgba(0,0,0,0.22);
    }
    .btn-gps { background: #2e7d32; }
    .btn-undo { background: #555; }
    .btn-clear { background: #c62828; }
    .btn-save { background: #0b57d0; }

    .saved-drawer {
      position: absolute; bottom: calc(58px + env(safe-area-inset-bottom)); left: 8px; right: 8px; z-index: 15;
      max-height: 170px; overflow-y: auto;
      background: rgba(255,255,255,0.98); border-radius: 9px;
      padding: 9px; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      font-size: 12px; display: none;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid #ddd; }
    .saved-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #eee;
    }
    .saved-item:last-child { border-bottom: none; }

    .pt-dot-total {
      width: 11px; height: 11px; border-radius: 50%;
      background: #ff1744; border: 2px solid #ffffff;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .pt-dot-sub {
      width: 11px; height: 11px; border-radius: 50%;
      background: #f59e0b; border: 2px solid #ffffff;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .yellow-dot-wrap {
      position: relative; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .yellow-dot-pulse {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255, 214, 0, 0.35);
    }
    .yellow-dot-core {
      position: relative; width: 13px; height: 13px; border-radius: 50%;
      background: #ffd600; border: 2px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>

<div id="mapViewport">
  <div id="mapStage">
    <div id="map"></div>
  </div>
</div>

<div class="top-panel">
  <div class="addr-row">
    <div class="addr-text" id="addressText">지도 터치 시 지번 표시</div>
    <div class="addr-actions">
      <button class="mini-btn" onclick="toggleSearch()">검색</button>
      <button class="mini-btn" onclick="copyAddress()">복사</button>
    </div>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="지번·도로명 검색 (예: 판포리 2729)" onkeypress="if(event.key==='Enter') searchAddress()" />
    <button onclick="searchAddress()">이동</button>
  </div>

  <div class="area-strip">
    <div class="area-cell active-total" id="cellTotal" onclick="setMode('total')">
      <div class="area-label"><span>① 전체</span><span><span id="cntTotal">0</span>점</span></div>
      <div class="area-main-red" id="totalM2">0.0 ㎡</div>
      <div class="area-sub" id="totalPyeong">0.0 평</div>
    </div>
    <div class="area-cell" id="cellSub" onclick="setMode('sub')">
      <div class="area-label"><span>② 부분</span><span><span id="cntSub">0</span>점</span></div>
      <div class="area-main-amber" id="subM2">0.0 ㎡</div>
      <div class="area-sub" id="subPyeong">0.0 평</div>
    </div>
    <div class="ratio-box">
      <div class="area-label" style="justify-content:flex-end;">비율</div>
      <div class="ratio-val" id="ratioText">0.0%</div>
      <div class="ratio-rem" id="remainText">잔여 0.0㎡</div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="layer-controls">
    <button class="layer-btn active" id="btnSky" onclick="toggleSkyview()">위성지도</button>
    <button class="layer-btn" id="btnCadastral" onclick="toggleCadastral()">지적편집도</button>
    <button class="layer-btn" id="btnList" onclick="toggleSavedList()">저장목록</button>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()" title="확대">+</button>
    <div class="zoom-badge" id="zoomBadge">L1</div>
    <button class="zoom-btn" onclick="zoomOut()" title="축소">−</button>
    <button class="mag-btn active" id="mag10" onclick="setMagnification(1)">×1.0</button>
    <button class="mag-btn" id="mag15" onclick="setMagnification(1.5)">×1.5</button>
    <button class="mag-btn" id="mag20" onclick="setMagnification(2)">×2.0</button>
  </div>
</div>

<div class="saved-drawer" id="savedDrawer">
  <div class="drawer-header">
    <strong>저장된 농지 측정 기록</strong>
    <div>
      <button class="mini-btn" onclick="copyAllRecords()">전체 엑셀복사</button>
      <button class="mini-btn" style="color:#c62828;" onclick="clearAllRecords()">전체삭제</button>
    </div>
  </div>
  <div id="savedListBody"></div>
</div>

<div class="bottom-bar">
  <button class="action-btn btn-gps" onclick="moveToMyLocation()">내 위치</button>
  <button class="action-btn btn-undo" onclick="undoPoint()">이전점 취소</button>
  <button class="action-btn btn-clear" onclick="clearCurrent()">현재 초기화</button>
  <button class="action-btn btn-save" onclick="saveRecord()">기록 저장</button>
</div>

<script>
  const STORAGE_KEY = 'farmland_measure_records_v1';
  let map, geocoder, myLocationOverlay = null;
  let currentMode = 'total';
  let isSkyview = true;
  let isCadastral = false;
  let currentJibun = '';
  let magScale = 1;

  const state = {
    total: { points: [], overlays: [], polygon: null },
    sub: { points: [], overlays: [], polygon: null }
  };

  window.onload = function () {
    const container = document.getElementById('map');
    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(33.3617, 126.5292),
      level: 1,
      mapTypeId: kakao.maps.MapTypeId.HYBRID
    });
    geocoder = new kakao.maps.services.Geocoder();

    state.total.polygon = new kakao.maps.Polygon({
      map: map, path: [], strokeWeight: 3, strokeColor: '#ff1744',
      strokeOpacity: 0.98, fillColor: '#ff1744', fillOpacity: 0.16
    });

    state.sub.polygon = new kakao.maps.Polygon({
      map: map, path: [], strokeWeight: 3, strokeColor: '#f59e0b',
      strokeOpacity: 0.98, fillColor: '#f59e0b', fillOpacity: 0.25
    });

    const viewport = document.getElementById('mapViewport');
    viewport.addEventListener('click', function (e) {
      if (e.target.closest('.top-panel, .right-panel, .bottom-bar, .saved-drawer')) return;
      if (magScale <= 1) return;

      const rect = viewport.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const stageX = cx + (clickX - cx) / magScale;
      const stageY = cy + (clickY - cy) / magScale;

      const proj = map.getProjection();
      if (!proj) return;
      const latLng = proj.coordsFromPoint(new kakao.maps.Point(stageX, stageY));
      addPoint(latLng);
    }, true);

    kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
      if (magScale > 1) return;
      addPoint(mouseEvent.latLng);
    });

    kakao.maps.event.addListener(map, 'zoom_changed', updateZoomBadge);
    updateZoomBadge();
    renderSavedList();
    moveToMyLocation(true);
  };

  function setMagnification(scale) {
    magScale = scale;
    const stage = document.getElementById('mapStage');
    stage.style.transform = `scale(${scale})`;

    document.getElementById('mag10').classList.toggle('active', scale === 1);
    document.getElementById('mag15').classList.toggle('active', scale === 1.5);
    document.getElementById('mag20').classList.toggle('active', scale === 2);

    setTimeout(() => {
      if (map) map.relayout();
    }, 160);
  }

  function updateZoomBadge() {
    if (!map) return;
    document.getElementById('zoomBadge').innerText = 'L' + map.getLevel();
  }

  function zoomIn() {
    if (!map) return;
    const lv = map.getLevel();
    if (lv > 1) map.setLevel(lv - 1);
  }

  function zoomOut() {
    if (!map) return;
    const lv = map.getLevel();
    if (lv < 14) map.setLevel(lv + 1);
  }

  function toggleSearch() {
    const bar = document.getElementById('searchBar');
    bar.classList.toggle('open');
    if (bar.classList.contains('open')) {
      document.getElementById('searchInput').focus();
    }
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('cellTotal').className = 'area-cell' + (mode === 'total' ? ' active-total' : '');
    document.getElementById('cellSub').className = 'area-cell' + (mode === 'sub' ? ' active-sub' : '');
  }

  function addPoint(latLng) {
    const target = state[currentMode];
    target.points.push(latLng);

    const dot = document.createElement('div');
    dot.className = currentMode === 'total' ? 'pt-dot-total' : 'pt-dot-sub';

    const overlay = new kakao.maps.CustomOverlay({
      position: latLng,
      content: dot,
      xAnchor: 0.5,
      yAnchor: 0.5,
      zIndex: 4
    });
    overlay.setMap(map);
    target.overlays.push(overlay);

    if (state.total.points.length === 1 && currentMode === 'total') {
      updateAddressFromCoord(latLng);
    } else if (!currentJibun && target.points.length === 1) {
      updateAddressFromCoord(latLng);
    }

    updateCalculations();
  }

  function updateAddressFromCoord(latLng) {
    geocoder.coord2Address(latLng.getLng(), latLng.getLat(), function (result, status) {
      if (status === kakao.maps.services.Status.OK && result[0]) {
        const jibun = result[0].address ? result[0].address.address_name : '';
        const road = result[0].road_address ? result[0].road_address.address_name : '';
        currentJibun = jibun || road;
        document.getElementById('addressText').innerText = jibun || road;
      }
    });
  }

  function updateCalculations() {
    state.total.polygon.setPath(state.total.points);
    state.sub.polygon.setPath(state.sub.points);

    const tM2 = state.total.points.length >= 3 ? state.total.polygon.getArea() : 0;
    const sM2 = state.sub.points.length >= 3 ? state.sub.polygon.getArea() : 0;
    const tPyeong = tM2 / 3.305785;
    const sPyeong = sM2 / 3.305785;

    document.getElementById('cntTotal').innerText = state.total.points.length;
    document.getElementById('cntSub').innerText = state.sub.points.length;
    document.getElementById('totalM2').innerText = `${tM2.toFixed(1)} ㎡`;
    document.getElementById('totalPyeong').innerText = `${tPyeong.toFixed(1)} 평`;
    document.getElementById('subM2').innerText = `${sM2.toFixed(1)} ㎡`;
    document.getElementById('subPyeong').innerText = `${sPyeong.toFixed(1)} 평`;

    const ratio = (tM2 > 0 && sM2 > 0) ? ((sM2 / tM2) * 100) : 0;
    const remain = Math.max(0, tM2 - sM2);
    document.getElementById('ratioText').innerText = `${ratio.toFixed(1)}%`;
    document.getElementById('remainText').innerText = `잔여 ${remain.toFixed(1)}㎡`;
  }

  function undoPoint() {
    const target = state[currentMode];
    if (target.points.length === 0) return;
    target.points.pop();
    const ov = target.overlays.pop();
    if (ov) ov.setMap(null);

    if (state.total.points.length === 0 && state.sub.points.length === 0) {
      currentJibun = '';
      document.getElementById('addressText').innerText = '지도 터치 시 지번 표시';
    }
    updateCalculations();
  }

  function clearCurrent() {
    ['total', 'sub'].forEach(key => {
      state[key].points = [];
      state[key].overlays.forEach(ov => ov.setMap(null));
      state[key].overlays = [];
    });
    currentJibun = '';
    document.getElementById('addressText').innerText = '지도 터치 시 지번 표시';
    setMode('total');
    updateCalculations();
  }

  function toggleSkyview() {
    isSkyview = !isSkyview;
    map.setMapTypeId(isSkyview ? kakao.maps.MapTypeId.HYBRID : kakao.maps.MapTypeId.ROADMAP);
    document.getElementById('btnSky').classList.toggle('active', isSkyview);
  }

  function toggleCadastral() {
    isCadastral = !isCadastral;
    if (isCadastral) {
      map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    } else {
      map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    }
    document.getElementById('btnCadastral').classList.toggle('active', isCadastral);
  }

  function showYellowDot(latLng) {
    if (myLocationOverlay) {
      myLocationOverlay.setPosition(latLng);
      myLocationOverlay.setMap(map);
      return;
    }
    const content = document.createElement('div');
    content.className = 'yellow-dot-wrap';
    content.innerHTML = '<div class="yellow-dot-pulse"></div><div class="yellow-dot-core"></div>';
    myLocationOverlay = new kakao.maps.CustomOverlay({
      position: latLng,
      content: content,
      xAnchor: 0.5,
      yAnchor: 0.5,
      zIndex: 5
    });
    myLocationOverlay.setMap(map);
  }

  function moveToMyLocation(silent) {
    if (!navigator.geolocation) {
      if (!silent) alert('이 기기에서 위치 정보를 지원하지 않습니다.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        showYellowDot(loc);
        map.setCenter(loc);
        map.setLevel(1);
      },
      () => {
        if (!silent) alert('위치 권한을 허용해 주세요.');
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  function searchAddress() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    geocoder.addressSearch(query, function (result, status) {
      if (status === kakao.maps.services.Status.OK) {
        const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
        map.setCenter(coords);
        map.setLevel(1);
        document.getElementById('searchBar').classList.remove('open');
      } else {
        alert('주소를 찾을 수 없습니다. 지번이나 도로명을 정확히 입력해 주세요.');
      }
    });
  }

  function copyAddress() {
    if (!currentJibun) return;
    navigator.clipboard.writeText(currentJibun).then(() => {
      alert('지번 복사됨: ' + currentJibun);
    });
  }

  function saveRecord() {
    const tM2 = state.total.points.length >= 3 ? state.total.polygon.getArea() : 0;
    const sM2 = state.sub.points.length >= 3 ? state.sub.polygon.getArea() : 0;
    if (tM2 === 0 && sM2 === 0) {
      alert('최소 3개 이상의 지점을 찍어 면적을 계산한 후 저장하세요.');
      return;
    }
    const tPyeong = tM2 / 3.305785;
    const sPyeong = sM2 / 3.305785;
    const ratio = (tM2 > 0 && sM2 > 0) ? ((sM2 / tM2) * 100).toFixed(1) : '0.0';

    const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    records.unshift({
      id: Date.now(),
      address: currentJibun || '주소 미확인',
      totalM2: tM2.toFixed(1),
      totalPyeong: tPyeong.toFixed(1),
      subM2: sM2.toFixed(1),
      subPyeong: sPyeong.toFixed(1),
      ratio: ratio,
      date: new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' })
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    renderSavedList();
    document.getElementById('savedDrawer').style.display = 'block';
    document.getElementById('btnList').classList.add('active');
  }

  function renderSavedList() {
    const body = document.getElementById('savedListBody');
    const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (records.length === 0) {
      body.innerHTML = '<div style="color:#777; text-align:center; padding:10px 0;">저장된 기록이 없습니다.</div>';
      return;
    }
    body.innerHTML = records.map(r => `
      <div class="saved-item">
        <div style="line-height:1.4;">
          <strong>${r.address}</strong> <span style="color:#888;">(${r.date})</span><br/>
          전체: ${r.totalM2}㎡(${r.totalPyeong}평) | 부분: ${r.subM2}㎡ (${r.ratio}%)
        </div>
        <button class="mini-btn" onclick="copyOneRecord(${r.id})">복사</button>
      </div>
    `).join('');
  }

  function copyOneRecord(id) {
    const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const r = records.find(item => item.id === id);
    if (!r) return;
    const line = `${r.address}\t${r.totalM2}\t${r.totalPyeong}\t${r.subM2}\t${r.subPyeong}\t${r.ratio}%`;
    navigator.clipboard.writeText(line).then(() => alert('엑셀 한 줄 형식으로 복사되었습니다.'));
  }

  function copyAllRecords() {
    const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (records.length === 0) return;
    const header = '지번주소\t전체면적(㎡)\t전체평수\t부분면적(㎡)\t부분평수\t비율(%)';
    const lines = records.map(r => `${r.address}\t${r.totalM2}\t${r.totalPyeong}\t${r.subM2}\t${r.subPyeong}\t${r.ratio}%`);
    navigator.clipboard.writeText([header, ...lines].join('\n')).then(() => alert('전체 목록이 엑셀 붙여넣기 형식으로 복사되었습니다.'));
  }

  function clearAllRecords() {
    if (!confirm('저장된 측정 기록을 모두 삭제할까요?')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderSavedList();
  }

  function toggleSavedList() {
    const drawer = document.getElementById('savedDrawer');
    const isOpen = drawer.style.display === 'block';
    drawer.style.display = isOpen ? 'none' : 'block';
    document.getElementById('btnList').classList.toggle('active', !isOpen);
  }
</script>
</body>
</html>
