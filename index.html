<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>farea</title>
  <script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=25bd6279b09da3619d1cfc1619d628f2&libraries=services"
  ></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg-dark: rgba(17, 24, 39, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 상단 영역 (검색 + 면적 정보 카드) */
    .top-stack {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .top-stack > * {
      pointer-events: auto;
    }

    .search-box {
      position: relative;
      display: flex;
      gap: 6px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px;
      backdrop-filter: blur(8px);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      height: 36px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14px;
      padding: 0 10px;
      border-radius: 8px;
      user-select: text;
    }

    .search-box input::placeholder {
      color: #9ca3af;
    }

    .mini-btn {
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-btn.active {
      background: #f59e0b;
      color: #111827;
      border-color: #f59e0b;
    }

    .search-results {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      background: #111827;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      z-index: 30;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }

    .search-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #f9fafb;
      cursor: pointer;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .search-item .title {
      font-size: 13px;
      font-weight: 600;
    }

    .search-item .sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .info-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .area-main {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .area-sub {
      font-size: 11px;
      color: #d1d5db;
      margin-top: 2px;
    }

    .mode-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      white-space: nowrap;
    }

    .mode-badge.hole {
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
    }

    /* 우측 보조 컨트롤 */
    .side-controls {
      position: fixed;
      right: 10px;
      top: 150px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .icon-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-dark);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      line-height: 1.1;
      text-align: center;
    }

    /* 하단 조작 바 */
    .bottom-bar {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + var(--safe-bottom));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 8px;
      backdrop-filter: blur(8px);
    }

    .action-btn {
      height: 44px;
      min-width: 48px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-btn.reset-text {
      font-size: 14px;
      padding: 0 14px;
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.35);
    }

    /* 캡처모드 상태 */
    .capture-mode .search-box,
    .capture-mode .search-results,
    .capture-mode .side-controls,
    .capture-mode .bottom-bar,
    .capture-mode .mode-badge {
      display: none !important;
    }

    .capture-exit-btn {
      display: none;
      position: fixed;
      left: 12px;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-dark);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .capture-mode .capture-exit-btn {
      display: inline-flex;
    }

    /* 최근 히스토리 패널 */
    .history-panel {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(68px + var(--safe-bottom));
      z-index: 25;
      max-height: 260px;
      overflow-y: auto;
      background: #111827;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 8px;
      color: #fff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }

    .history-panel.open {
      display: block;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 13px;
    }

    .history-row:last-child {
      border-bottom: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div class="top-stack">
      <div class="search-box">
        <input id="addrInput" type="text" placeholder="주소 또는 지번 검색" autocomplete="off" />
        <button id="addrSearchBtn" class="mini-btn" type="button">검색</button>
        <button id="holeToggleBtn" class="mini-btn" type="button">제외</button>
        <button id="historyBtn" class="mini-btn" type="button">기록</button>
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="info-card">
        <div>
          <div id="areaText" class="area-main">0.0 ㎡ (0.0 평)</div>
          <div id="parcelLabelText" class="area-sub hidden"></div>
        </div>
        <div id="modeBadge" class="mode-badge">외곽 측정</div>
      </div>
    </div>

    <div class="side-controls">
      <button id="mapTypeBtn" class="icon-circle-btn" type="button" aria-label="지도 전환">위성</button>
      <button id="zoomInBtn" class="icon-circle-btn" type="button" aria-label="확대">+</button>
      <button id="zoomOutBtn" class="icon-circle-btn" type="button" aria-label="축소">−</button>
      <button id="delHoleBtn" class="icon-circle-btn" type="button" aria-label="제외영역 삭제">제외<br/>삭제</button>
    </div>

    <div id="historyPanel" class="history-panel"></div>

    <div class="bottom-bar">
      <button id="myLocBtn" class="action-btn" type="button" aria-label="내 위치">⌖</button>
      <button id="undoBtn" class="action-btn" type="button" aria-label="이전점 취소">↩</button>
      <button id="resetBtn" class="action-btn reset-text" type="button">초기화</button>
      <button id="enterCaptureBtn" class="action-btn" type="button" aria-label="캡처모드 진입">⛶</button>
    </div>

    <button id="exitCaptureBtn" class="capture-exit-btn" type="button" aria-label="캡처모드 복귀">←</button>
  </div>

  <script>
    const STORAGE_KEY = "farea_state_v1";
    const HISTORY_KEY = "farea_history_v1";
    const MAX_HISTORY = 8;
    const SQM_TO_PYEONG = 0.3025;

    const state = {
      outerPoints: [],
      holes: [],
      currentHole: [],
      isHoleMode: false,
      isCaptureMode: false,
      autoCaptureTriggeredAt3: false,
      searchPin: null,
      myPos: null,
      isHybrid: true
    };

    let map, geocoder, places;
    let outerPolygon, outerPolyline;
    let holePolygons = [];
    let currentHolePolyline;
    let vertexOverlays = [];
    let midpointOverlays = [];
    let searchMarker = null;
    let searchInfowindow = null;
    let myLocationOverlay = null;
    let watchId = null;

    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      bindEvents();
      loadSavedState();
      startWatchPosition();
      renderAll();
    });

    function initMap() {
      const center = new kakao.maps.LatLng(33.3617, 126.2465);
      map = new kakao.maps.Map(document.getElementById("map"), {
        center,
        level: 3,
        mapTypeId: kakao.maps.MapTypeId.HYBRID
      });
      geocoder = new kakao.maps.services.Geocoder();
      places = new kakao.maps.services.Places();

      outerPolygon = new kakao.maps.Polygon({
        map,
        path: [],
        strokeWeight: 3,
        strokeColor: "#ef4444",
        strokeOpacity: 0.95,
        fillColor: "#ef4444",
        fillOpacity: 0.18
      });

      outerPolyline = new kakao.maps.Polyline({
        map,
        path: [],
        strokeWeight: 3,
        strokeColor: "#ef4444",
        strokeOpacity: 0.95
      });

      currentHolePolyline = new kakao.maps.Polyline({
        map,
        path: [],
        strokeWeight: 2,
        strokeColor: "#3b82f6",
        strokeStyle: "dash"
      });

      kakao.maps.event.addListener(map, "click", (mouseEvent) => {
        const latlng = mouseEvent.latLng;
        addPoint({ lat: latlng.getLat(), lng: latlng.getLng() });
      });
    }

    function addPoint(pt) {
      if (state.isHoleMode) {
        state.currentHole.push(pt);
        if (state.currentHole.length >= 3) {
          state.holes.push([...state.currentHole]);
          state.currentHole = [];
          state.isHoleMode = false;
          document.getElementById("holeToggleBtn").classList.remove("active");
        }
      } else {
        state.outerPoints.push(pt);
        if (state.outerPoints.length === 3 && !state.autoCaptureTriggeredAt3 && !state.isCaptureMode) {
          state.autoCaptureTriggeredAt3 = true;
          setCaptureMode(true);
        }
      }

      saveState();
      renderAll();
    }

    function insertMidpoint(targetList, index, pt) {
      targetList.splice(index + 1, 0, pt);
      saveState();
      renderAll();
    }

    function setCaptureMode(enabled) {
      state.isCaptureMode = enabled;
      document.getElementById("app").classList.toggle("capture-mode", enabled);
      document.getElementById("historyPanel").classList.remove("open");
    }

    function calcPolygonAreaSqm(points) {
      if (!points || points.length < 3) return 0;
      const R = 6378137;
      const toRad = (deg) => (deg * Math.PI) / 180;
      let total = 0;

      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        const lat1 = toRad(p1.lat);
        const lat2 = toRad(p2.lat);
        const dLng = toRad(p2.lng - p1.lng);
        total += dLng * (2 + Math.sin(lat1) + Math.sin(lat2));
      }
      return Math.abs((total * R * R) / 2);
    }

    function calcNetAreaSqm() {
      const outerArea = calcPolygonAreaSqm(state.outerPoints);
      const holeArea = state.holes.reduce((sum, h) => sum + calcPolygonAreaSqm(h), 0);
      return Math.max(0, outerArea - holeArea);
    }

    function renderAll() {
      clearOverlays();

      const outerLatLngs = state.outerPoints.map((p) => new kakao.maps.LatLng(p.lat, p.lng));
      if (outerLatLngs.length >= 3) {
        outerPolygon.setPath(outerLatLngs);
        outerPolyline.setPath([]);
      } else {
        outerPolygon.setPath([]);
        outerPolyline.setPath(outerLatLngs);
      }

      holePolygons.forEach((poly) => poly.setMap(null));
      holePolygons = state.holes.map((hole) => {
        return new kakao.maps.Polygon({
          map,
          path: hole.map((p) => new kakao.maps.LatLng(p.lat, p.lng)),
          strokeWeight: 2,
          strokeColor: "#2563eb",
          strokeOpacity: 0.9,
          fillColor: "#3b82f6",
          fillOpacity: 0.28
        });
      });

      currentHolePolyline.setPath(
        state.currentHole.map((p) => new kakao.maps.LatLng(p.lat, p.lng))
      );

      state.outerPoints.forEach((pt, idx) => {
        const el = document.createElement("div");
        el.style.cssText =
          "width:14px;height:14px;border-radius:50%;background:#ffffff;border:3px solid #ef4444;box-shadow:0 1px 4px rgba(0,0,0,0.4);cursor:pointer;";

        let moved = false;
        let startX = 0, startY = 0;

        el.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          moved = false;
          startX = e.clientX;
          startY = e.clientY;
          map.setDraggable(false);

          const onMove = (moveEvt) => {
            if (Math.hypot(moveEvt.clientX - startX, moveEvt.clientY - startY) > 5) {
              moved = true;
            }
            const rect = map.getNode().getBoundingClientRect();
            const point = new kakao.maps.Point(moveEvt.clientX - rect.left, moveEvt.clientY - rect.top);
            const coords = map.getProjection().coordsFromContainerPoint(point);
            state.outerPoints[idx] = { lat: coords.getLat(), lng: coords.getLng() };
            updateGeometryOnly();
          };

          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            map.setDraggable(true);
            if (!moved) {
              state.outerPoints.splice(idx, 1);
            }
            saveState();
            renderAll();
          };

          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        });

        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(pt.lat, pt.lng),
          content: el,
          yAnchor: 0.5,
          xAnchor: 0.5
        });
        overlay.setMap(map);
        vertexOverlays.push(overlay);
      });

      if (state.outerPoints.length >= 2) {
        const segCount = state.outerPoints.length >= 3 ? state.outerPoints.length : state.outerPoints.length - 1;
        for (let i = 0; i < segCount; i++) {
          const a = state.outerPoints[i];
          const b = state.outerPoints[(i + 1) % state.outerPoints.length];
          const midLat = (a.lat + b.lat) / 2;
          const midLng = (a.lng + b.lng) / 2;

          const midEl = document.createElement("div");
          midEl.style.cssText =
            "width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.85);border:2px solid #dc2626;cursor:pointer;";
          midEl.addEventListener("click", (e) => {
            e.stopPropagation();
            insertMidpoint(state.outerPoints, i, { lat: midLat, lng: midLng });
          });

          const midOverlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(midLat, midLng),
            content: midEl,
            yAnchor: 0.5,
            xAnchor: 0.5
          });
          midOverlay.setMap(map);
          midpointOverlays.push(midOverlay);
        }
      }

      renderSearchPin();
      renderMyLocation();
      updateAreaAndBadge();
    }

    function updateGeometryOnly() {
      const outerLatLngs = state.outerPoints.map((p) => new kakao.maps.LatLng(p.lat, p.lng));
      if (outerLatLngs.length >= 3) {
        outerPolygon.setPath(outerLatLngs);
        outerPolyline.setPath([]);
      } else {
        outerPolygon.setPath([]);
        outerPolyline.setPath(outerLatLngs);
      }
      updateAreaAndBadge();
    }

    function updateAreaAndBadge() {
      const sqm = calcNetAreaSqm();
      const pyeong = sqm * SQM_TO_PYEONG;
      document.getElementById("areaText").textContent =
        `${sqm.toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ㎡ (${pyeong.toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} 평)`;

      const badge = document.getElementById("modeBadge");
      if (state.isHoleMode) {
        badge.textContent = `제외 영역 (${state.currentHole.length}/3)`;
        badge.classList.add("hole");
      } else {
        badge.textContent = `외곽 점 ${state.outerPoints.length}개 · 제외 ${state.holes.length}곳`;
        badge.classList.remove("hole");
      }
    }

    function renderSearchPin() {
      if (searchMarker) searchMarker.setMap(null);
      if (searchInfowindow) searchInfowindow.close();

      const labelEl = document.getElementById("parcelLabelText");
      if (!state.searchPin) {
        labelEl.classList.add("hidden");
        return;
      }

      const pos = new kakao.maps.LatLng(state.searchPin.lat, state.searchPin.lng);
      const pinImage = new kakao.maps.MarkerImage(
        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_yellow.png",
        new kakao.maps.Size(29, 42),
        { offset: new kakao.maps.Point(14, 42) }
      );

      searchMarker = new kakao.maps.Marker({
        map,
        position: pos,
        image: pinImage
      });

      searchInfowindow = new kakao.maps.InfoWindow({
        content: `<div style="padding:4px 8px;font-size:12px;color:#111827;">${escapeHtml(state.searchPin.label)}</div>`
      });

      if (state.searchPin.showLabel) {
        searchInfowindow.open(map, searchMarker);
        labelEl.textContent = state.searchPin.label;
        labelEl.classList.remove("hidden");
      } else {
        labelEl.classList.add("hidden");
      }

      kakao.maps.event.addListener(searchMarker, "click", () => {
        state.searchPin.showLabel = !state.searchPin.showLabel;
        saveState();
        renderSearchPin();
      });
    }

    function renderMyLocation() {
      if (myLocationOverlay) {
        myLocationOverlay.setMap(null);
        myLocationOverlay = null;
      }
      if (!state.myPos) return;

      const dot = document.createElement("div");
      dot.style.cssText =
        "width:16px;height:16px;border-radius:50%;background:#facc15;border:3px solid #ffffff;box-shadow:0 0 8px rgba(0,0,0,0.5);";

      myLocationOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(state.myPos.lat, state.myPos.lng),
        content: dot,
        yAnchor: 0.5,
        xAnchor: 0.5
      });
      myLocationOverlay.setMap(map);
    }

    function clearOverlays() {
      vertexOverlays.forEach((o) => o.setMap(null));
      vertexOverlays = [];
      midpointOverlays.forEach((o) => o.setMap(null));
      midpointOverlays = [];
    }

    function startWatchPosition() {
      if (!navigator.geolocation || watchId !== null) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          state.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          renderMyLocation();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    function searchAddress(query) {
      const q = query.trim();
      const box = document.getElementById("searchResults");
      if (!q) {
        box.classList.add("hidden");
        return;
      }

      const items = [];
      geocoder.addressSearch(q, (addrRes, addrStatus) => {
        if (addrStatus === kakao.maps.services.Status.OK) {
          addrRes.forEach((r) => {
            items.push({
              title: r.address_name,
              sub: r.road_address ? r.road_address.address_name : "지번",
              lat: parseFloat(r.y),
              lng: parseFloat(r.x)
            });
          });
        }
        places.keywordSearch(q, (kwRes, kwStatus) => {
          if (kwStatus === kakao.maps.services.Status.OK) {
            kwRes.forEach((r) => {
              items.push({
                title: r.place_name,
                sub: r.address_name,
                lat: parseFloat(r.y),
                lng: parseFloat(r.x)
              });
            });
          }
          renderSearchResults(items);
        });
      });
    }

    function renderSearchResults(items) {
      const box = document.getElementById("searchResults");
      box.innerHTML = "";
      if (!items.length) {
        box.innerHTML = `<div class="search-item"><div class="title">검색 결과 없음</div></div>`;
        box.classList.remove("hidden");
        return;
      }

      items.slice(0, 8).forEach((item) => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.innerHTML = `<div class="title">${escapeHtml(item.title)}</div><div class="sub">${escapeHtml(item.sub)}</div>`;
        div.addEventListener("click", () => {
          state.searchPin = {
            lat: item.lat,
            lng: item.lng,
            label: item.title,
            showLabel: true
          };
          map.setCenter(new kakao.maps.LatLng(item.lat, item.lng));
          box.classList.add("hidden");
          saveState();
          renderSearchPin();
        });
        box.appendChild(div);
      });
      box.classList.remove("hidden");
    }
